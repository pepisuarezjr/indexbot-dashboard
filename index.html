<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Bot</title>
<style>
:root{--bg:#0a0d10;--panel:#11161b;--panel2:#161c22;--line:#222a33;--text:#e8ebee;--muted:#8792a0;
--dim:#5b6673;--buy:#3ecf8e;--sell:#f0616d;--amber:#f5b942;--kraken:#9b8cff;--coinbase:#4c8dff;
--alpaca:#f5d142;--binanceus:#f08c3a;--none:#39424d;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:22px}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
h1 span{color:var(--muted);font-weight:450}
.pill{font:600 11px/1 var(--mono);letter-spacing:.09em;padding:7px 10px;border-radius:999px;border:1px solid}
.pill.PRACTICE{color:var(--amber);border-color:#5a4720;background:#211a0b}
.pill.DRY{color:var(--coinbase);border-color:#1f3a66;background:#0c1830}
.ix-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
.ix-top .up{color:var(--buy)}.ix-top .down{color:var(--sell)}
.ix-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.ix-ctl .lab{color:var(--dim);font:11px var(--sans);letter-spacing:.07em;text-transform:uppercase;margin:0 2px 0 6px}
.ixbox{position:relative;width:100%;height:clamp(420px,62vh,660px)}
.ixread{position:absolute;left:10px;top:8px;z-index:3;pointer-events:none;font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 90px)}
.ixread b{color:var(--text);font-weight:600}.ixread .up{color:var(--buy)}.ixread .down{color:var(--sell)}
.ixcd{position:absolute;right:0;z-index:4;display:none;background:#8792a0;color:#0a0d10;font:600 11px/1 var(--mono);text-align:center;padding:3px 0;pointer-events:none;font-variant-numeric:tabular-nums}
#ixcard.full{position:fixed;inset:0;z-index:50;border-radius:0;margin:0!important;overflow:auto}
#ixcard.full .ixbox{height:calc(100vh - 150px)}
.pill.PAPER{color:var(--kraken);border-color:#3b3470;background:#15122b}
.perf{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;margin-top:12px}
.perf svg{flex:1;min-width:260px;height:70px}
.perf .up{color:var(--buy)}.perf .down{color:var(--sell)}
.pill.LIVE{color:var(--buy);border-color:#1d5a40;background:#0b2118}
.live{font:600 11px/1 var(--mono);letter-spacing:.07em;color:var(--muted);display:none;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.live.on{color:var(--buy)}.live.on i{background:var(--buy);animation:pulse 1.6s infinite}
.live.off{color:var(--amber)}.live.off i{background:var(--amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3ecf8e88}100%{box-shadow:0 0 0 8px #3ecf8e00}}
@media(prefers-reduced-motion:reduce){.live.on i{animation:none}}
.when{margin-left:auto;color:var(--muted);font:12px var(--mono)}
.share{background:#15122b;border:1px solid #3b3470;color:#c9c2ff;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:none}
.timers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.timers .how{grid-column:1/-1}
.how .cols{columns:2;column-gap:36px}.how .blk{break-inside:avoid;margin-bottom:12px}.how .blk .sub{margin-top:0}
.how .head{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.how .nowline{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--mono);padding:5px 10px;border-radius:999px;margin:4px 0 10px;border:1px solid var(--line);color:var(--buy);background:#0b2118;border-color:#1d5a40}
.how .nowline.busy{color:var(--amber);background:#211a0b;border-color:#5a4720}
.how .nowline i{width:7px;height:7px;border-radius:50%;background:currentColor}
.timers .clock{font:600 26px/1.1 var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.timers .warn{color:var(--amber)}
.how{font-size:13px;line-height:1.55;color:var(--text)}
.how ul,.how ol{margin:4px 0 0;padding-left:20px;color:var(--muted)}.how li{margin:2px 0}.how b{color:var(--text);font-weight:600}
.how .sub{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text);margin:12px 0 3px}
.how .nowline{margin-bottom:14px!important}
.how .para{color:var(--muted)}
.livenote{color:var(--muted);font-size:12.5px;line-height:1.5;margin:-10px 0 16px;display:none}
.livenote b{color:var(--text);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.k-val{font:600 26px/1.1 var(--mono);letter-spacing:-.02em}
.k-sub{color:var(--muted);font-size:12px;margin-top:8px}
h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.cov{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--none);margin:6px 0 12px}
.cov i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.acct{border-top:2px solid var(--c)}
.acct.off{opacity:.55}
.a-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.a-name{font-weight:650;font-size:15px}
.a-status{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.a-status.connected{color:var(--buy)}.a-status.practice{color:var(--amber)}.a-status.error{color:var(--sell)}
.a-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted);font-size:13px}
.a-row b{color:var(--text);font:500 13px var(--mono)}
.a-msg{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.a-msg.need{color:var(--amber)}.a-msg.err{color:var(--sell)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:13px var(--sans);cursor:pointer}
.chip:hover{color:var(--text)}.chip.on{background:var(--panel2);color:var(--text);border-color:#3a4552}
.chip:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--coinbase);outline-offset:2px}
input[type=search]{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 11px;font:13px var(--sans);min-width:190px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th.sorted{color:var(--text)}
td{padding:10px 14px;border-bottom:1px solid #191f26;text-align:right;font:13px var(--mono);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.skip td{color:var(--dim)}
.tk{font:650 13px var(--mono)}.nm{color:var(--muted);font:12px var(--sans)}
.bar{position:relative;width:150px;height:8px;background:#1c232b;border-radius:4px;display:inline-block;vertical-align:middle}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.act{font:600 12px var(--mono)}.act.buy{color:var(--buy)}.act.sell{color:var(--sell)}.act.hold{color:var(--dim);font-weight:400}
.note{display:block;color:var(--dim);font:11.5px var(--sans);white-space:normal;max-width:240px;margin-left:auto}
.res{font:600 10px var(--mono);padding:2px 5px;border-radius:4px;margin-left:6px}
.res.ok{background:#0f2a1e;color:var(--buy)}.res.failed{background:#2e1216;color:var(--sell)}
.empty{padding:22px;color:var(--muted);text-align:center}
.split{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:28px;align-items:center}
.donut{width:100%;max-width:320px;margin:0 auto;display:block}
.donut path{cursor:pointer;transition:opacity .12s}
.donut.hov path{opacity:.35}.donut.hov path.on{opacity:1}
.donut text{pointer-events:none}
.c-big{font:600 17px var(--mono);fill:var(--text);letter-spacing:-.02em}
.c-lab{font:500 11px var(--sans);fill:var(--muted)}.c-sub{font:10.5px var(--sans);fill:var(--dim)}
.slist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 26px}
.srow{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;font-size:13px;cursor:default}
.srow.on{background:var(--panel2)}
.srow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.srow .sl{font:650 12.5px var(--mono)}.srow .ss{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.srow .more{white-space:normal;color:var(--muted);font-size:12px}
.srow b{font:500 12.5px var(--mono)}.srow em{font:normal 12px var(--mono);color:var(--muted);min-width:62px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:6px 13px;font:13px var(--sans);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--coinbase);outline-offset:-2px}
.s-note{color:var(--muted);font-size:12px;margin-left:auto}
footer{margin-top:28px;color:var(--dim);font-size:12px;line-height:1.6}
@media(max-width:860px){.timers{grid-template-columns:minmax(0,1fr)}.how .cols{columns:1}.split{grid-template-columns:minmax(0,1fr)}.slist{grid-template-columns:minmax(0,1fr)}.srow em{min-width:0}.s-note{margin-left:0;width:100%}.kpis{grid-template-columns:repeat(2,1fr)}.k-val{font-size:22px}.when{margin-left:0;width:100%}input[type=search]{margin-left:0;width:100%}}

  const bt=el('td','l');if(r.venue){const bar=el('span','bar');bar.style.setProperty('--c',col(r.venue));const i=el('i');i.style.width=Math.min(100,r.cur_usd/maxT*100)+'%';const u=el('u');u.style.left='calc('+Math.min(100,r.target_usd/maxT*100)+'% - 1px)';bar.append(i,u);bar.title='Current '+usd(r.cur_usd)+' · target '+usd(r.target_usd);bt.append(bar)}tr.append(bt);
  tr.append(el('td',null,r.venue?price(r.price):'—'));
  const a=el('td');if(r.action==='buy'||r.action==='sell'){a.append(el('span','act '+r.action,r.action.toUpperCase()+' '+usd(r.order_usd)));if(r.result)a.append(el('span','res '+r.result,r.result.toUpperCase()))}else a.append(el('span','act hold',r.venue?'hold':'skipped'));
  if(r.note)a.append(el('span','note',r.note));tr.append(a);b.append(tr)})}
const counts={all:D.rows.length,buy:D.rows.filter(r=>r.action==='buy').length,sell:D.rows.filter(r=>r.action==='sell').length,hold:D.rows.filter(r=>r.action==='hold').length,skipped:D.rows.filter(r=>!r.venue).length};
[['all','All'],['buy','Buys'],['sell','Sells'],['hold','Holding'],['skipped','Skipped']].forEach(f=>{const c=el('button','chip'+(f[0]===filter?' on':''),f[1]+' '+counts[f[0]]);c.onclick=()=>{filter=f[0];document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');draw()};$('tools').append(c)});

{const t=$('trades');if(!D.trades.length){t.append(el('div','empty',D.mode==='PAPER'?'No paper trades yet.':'No real trades yet. Orders the bot places will be listed here.'))}else{const tb=el('table'),hd=el('tr');['Time (UTC)','Account','Symbol','Side','Est. $','Status'].forEach((x,i)=>hd.append(el('th',i<4?'l':'',x)));const th=el('thead');th.append(hd);const bd=el('tbody');
 D.trades.forEach(x=>{const tr=el('tr');tr.append(el('td','l',(x.time_utc||'').replace('T',' ').slice(0,16)),el('td','l',D.labels[x.account]||x.account||''),el('td','l',x.symbol),el('td','l act '+x.side,(x.side||'').toUpperCase()),el('td',null,usd(x.est_usd)));const s=el('td');s.append(el('span','res '+(x.status==='ok'?'ok':'failed'),x.status==='ok'?'OK':'FAILED'));tr.append(s);bd.append(tr)});tb.append(th,bd);t.append(tb)}}
$('foot').textContent=(D.float?'Targets float with price from the '+D.base_date+' index weights (buy and hold). ':'Targets are the fixed '+D.base_date+' index weights. ')+'A position trades only when it is more than '+pct(D.settings.band,0)+' away from target and the trade is at least '+usd(D.settings.min)+'. '+pct(D.settings.buffer,0)+' is kept in cash. The white mark on each bar is the target. This page is a snapshot from the last run; run the bot again to refresh it.';
// ---- live prices: Kraken's public stream moves prices between the bot's checks ----
(function(){const W=D.ws,tag=$('livetag'),txt=$('livetxt');if(!W||!W.symbols||!W.symbols.length||!window.WebSocket)return;
 const bySym={};D.rows.forEach(r=>{if(r.venue==='kraken'&&r.symbol)bySym[r.symbol]=r});
 const M=(D.index&&D.index.members)||{},n=W.symbols.length;
 let dirty=false,lastMsg=0,lastDraw=0,ws=null,tries=0,ticks=0;
 const slow=D.rows.filter(r=>r.venue&&r.venue!=='kraken'),gap=D.shared?'about every '+D.shared.every+' minutes':D.watch?'every '+D.watch+' minutes':'each time the bot runs',note=$('livenote');
 const group=()=>{const g={};slow.forEach(r=>{(g[r.venue]=g[r.venue]||[]).push(r.ticker)});return Object.keys(g).map(v=>g[v].join(', ')+' ('+D.labels[v]+(v==='alpaca'?', stocks':'')+')').join('; ')};
 function state(s){tag.style.display='inline-flex';tag.className='live '+s;txt.textContent=s==='on'?'LIVE · '+n+' of '+(n+slow.length)+' prices streaming':s==='wait'?'Connecting to live prices…':'Live stream off';
  note.style.display='block';note.textContent='';
  if(s==='on'){note.append(el('b',null,n+' prices are live, second by second'),document.createTextNode(' (everything held on Kraken). '));
   if(slow.length){note.append(el('b',null,slow.length+' are delayed'),document.createTextNode(': '+group()+'. These refresh '+gap+', not second by second'+(slow.some(r=>r.venue==='alpaca')?', and the stocks only change while the US market is open':'')+'.'))}}
  else note.append(document.createTextNode(s==='wait'?'Connecting to the live price stream. Until it connects, every price refreshes '+gap+'.':'The live price stream is not connected, so every price is delayed and refreshes '+gap+'.'))}
 function recompute(){let num=0,den=0,b=null;D.rows.forEach(r=>{const base=M[r.ticker];if(r.venue&&base&&r.price){num+=r.base_weight*r.price/base;den+=r.base_weight;if(r.ticker==='BTC')b=r.price/base*100}});
  const level=den?num/den*100:null;let value=null;
  if(D.mode!=='PRACTICE'){value=D.cash;D.rows.forEach(r=>{if(r.venue){r.cur_usd=(r.held||0)*r.price;value+=r.cur_usd}});D.value=value;
   const k=$('kpi0');if(k){k.children[1].textContent=usd(value);if(D.paper){const rt=value/D.paper.start-1;k.children[2].textContent='Started with '+usd(D.paper.start)+' · '+(rt>=0?'+':'')+pct(rt,2)+' since'}}}
  if(window.__live)window.__live(level,b,value);
  if(Date.now()-lastDraw>3000&&typeof draw==='function'){lastDraw=Date.now();draw()}}
 function connect(){state('wait');try{ws=new WebSocket(W.url)}catch(e){state('off');return}
  ws.onopen=()=>{ws.send(JSON.stringify({method:'subscribe',params:{channel:'ticker',symbol:W.symbols}}))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.channel!=='ticker'||!Array.isArray(m.data))return;
   m.data.forEach(d=>{const r=bySym[d.symbol],px=+d.last;if(r&&px>0){r.price=px;dirty=true;ticks++}});lastMsg=Date.now();tries=0};
  ws.onclose=()=>{ws=null;if(tries++<30)setTimeout(connect,Math.min(30000,1500*tries));else state('off')};
  ws.onerror=()=>{try{ws.close()}catch(x){}}}
 setInterval(()=>{if(lastMsg)state(Date.now()-lastMsg<20000?'on':(ws?'wait':'off'));else if(tries>3)state('off');if(dirty){dirty=false;recompute()}},500);
 window.__liveStats=()=>({ticks:ticks,connected:!!ws});
 connect()})();
